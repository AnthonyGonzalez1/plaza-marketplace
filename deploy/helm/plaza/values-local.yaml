# Overrides for the local kind cluster (deploy/kind/up.sh).

# Images are built on the laptop and loaded into the cluster, not pulled from a registry.
imageTag: local
imagePullPolicy: Never

storeApi:
  image: plaza-store-api
web:
  image: plaza-web

postgres:
  # Throwaway local database: this password protects nothing.
  password: plaza

payments:
  webhookSecret: local-dev-webhook-secret
  simulator:
    image: plaza-payment-simulator

rabbitmq:
  password: plaza

notifications:
  image: plaza-notification-service

mailpit:
  # Local inbox at http://plaza.localhost/mailpit
  ingress:
    enabled: true

ingress:
  host: plaza.localhost
