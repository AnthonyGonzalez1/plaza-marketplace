{{- $selector := dict "root" . "component" "postgres" }}
# Headless Service (clusterIP: None): gives the database pod a stable DNS name,
# <release>-postgres, without load balancing. Required by the StatefulSet below.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "plaza.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "plaza.selectorLabels" $selector | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# StatefulSet instead of Deployment because the database has state: the pod keeps the same
# name (<release>-postgres-0) and is always re-attached to the same volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "plaza.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "plaza.selectorLabels" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plaza.selectorLabels" $selector | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          volumeMounts:
            # PostgreSQL 18 images keep the data under /var/lib/postgresql/<major>/.
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  # One PersistentVolumeClaim per pod, created from this template. It survives pod restarts
  # and chart upgrades, and it is NOT deleted by "helm uninstall".
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
