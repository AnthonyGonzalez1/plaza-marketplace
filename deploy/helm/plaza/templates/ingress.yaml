{{- if .Values.ingress.enabled }}
# Entry point from outside the cluster. The ingress controller (Traefik) reads this object
# and routes each request by host and path to a Service:
#   /api, /swagger-ui, /v3/api-docs  -> store-api
#   everything else                  -> web (the React app)
# The browser sees a single origin, so no CORS is involved.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plaza.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/api" "/swagger-ui" "/v3/api-docs" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-store-api
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  name: http
{{- end }}
