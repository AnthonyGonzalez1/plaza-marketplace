{{- if .Values.ingress.enabled }}
# Entry point from outside the cluster. The ingress controller (Traefik) reads this object
# and routes each request by host and path to a Service:
#   /api, /swagger-ui, /v3/api-docs  -> store-api
#   everything else                  -> web (the React app)
# The browser sees a single origin, so no CORS is involved.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "plaza.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    # cert-manager sees this annotation, asks the issuer (Let's Encrypt) for a certificate
    # for the hosts in "tls" below and stores it in the Secret named there. It also renews it.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
    # Traefik: run the redirect Middleware defined at the end of this file on every request.
    # The format is <namespace>-<middleware name>@kubernetescrd.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-https-redirect@kubernetescrd
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/api" "/swagger-ui" "/v3/api-docs" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-store-api
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  name: http
{{- if .Values.ingress.tls.enabled }}
---
# Traefik-specific object: answers plain HTTP requests with a permanent redirect to HTTPS.
# Requests that already arrive over HTTPS pass through unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-https-redirect
  labels:
    {{- include "plaza.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- end }}
