spring.application.name=store-api

# Database. Every value comes from an environment variable; the defaults only work for the
# local PostgreSQL started by compose.yaml.
spring.datasource.url=${PLAZA_DB_URL:jdbc:postgresql://localhost:5432/plaza}
spring.datasource.username=${PLAZA_DB_USER:plaza}
spring.datasource.password=${PLAZA_DB_PASSWORD:plaza}

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading while rendering the response: everything is loaded inside the service.
spring.jpa.open-in-view=false

# Redis holds the shopping carts. Same rule: environment variables, defaults for compose.yaml.
spring.data.redis.host=${PLAZA_REDIS_HOST:localhost}
spring.data.redis.port=${PLAZA_REDIS_PORT:6379}
# A cart that nobody touches for this long is deleted by Redis.
plaza.cart.ttl=${PLAZA_CART_TTL:7d}
# How long an order waits for its payment while its units stay reserved.
plaza.orders.payment-window=${PLAZA_ORDER_PAYMENT_WINDOW:15m}

# Payment gateway (the payment-simulator service) and the secret both sides share to sign
# webhooks. The default secret only works locally; real environments must set their own.
plaza.payments.gateway-url=${PLAZA_PAYMENT_URL:http://localhost:3001}
plaza.payments.webhook-secret=${PLAZA_PAYMENT_WEBHOOK_SECRET:local-dev-webhook-secret}
# How often the job that cancels unpaid orders runs.
plaza.orders.expiry-check-interval=${PLAZA_ORDER_EXPIRY_CHECK_INTERVAL:30s}

# RabbitMQ: where order events are published (see docs/events.md).
spring.rabbitmq.host=${PLAZA_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${PLAZA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${PLAZA_RABBITMQ_USER:plaza}
spring.rabbitmq.password=${PLAZA_RABBITMQ_PASSWORD:plaza}
# Publisher confirms: the broker acknowledges every message it has stored.
spring.rabbitmq.publisher-confirm-type=simple
# How often the outbox table is checked for events to publish.
plaza.outbox.poll-interval=${PLAZA_OUTBOX_POLL_INTERVAL:1s}

server.port=${PORT:8080}

# Origins (comma-separated) of the web apps allowed to call this API from a browser.
plaza.cors.allowed-origins=${PLAZA_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API docs: spec at /v3/api-docs, Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: expose only health and info over HTTP.
management.endpoints.web.exposure.include=health,info
# Kubernetes-style probes: /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Ready to receive traffic only when the database is reachable.
management.endpoint.health.group.readiness.include=readinessState,db

# On shutdown, stop accepting requests and let the ones in progress finish (up to 20 s).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
