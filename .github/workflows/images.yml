name: images

# Builds both container images and scans them for known vulnerabilities on every pull request.
# On main, the scanned images are also published to GitHub Container Registry (GHCR).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io with the built-in GITHUB_TOKEN (no personal token required).
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plaza-store-api
            context: services/store-api
          - name: plaza-web
            context: web
          - name: plaza-payment-simulator
            context: services/payment-simulator
          - name: plaza-notification-service
            context: services/notification-service
    env:
      # Registry paths must be lowercase.
      IMAGE: ghcr.io/anthonygonzalez1/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      # QEMU lets this amd64 runner execute the arm64 steps of the Dockerfiles (emulation).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # "load" keeps the image in the runner's Docker so it can be scanned before any push.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Fails the job on CRITICAL vulnerabilities that already have a fix available.
      # The action is pinned to a commit instead of a tag: tags can be moved, commits cannot.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the arm64 variant too (the production server is ARM) and pushes both under the
      # same tags; each machine pulls the variant that matches its CPU. The amd64 layers come
      # from the cache of the build above. Only the amd64 variant is scanned; both come from
      # the same Dockerfile and base image versions.
      # One immutable tag per commit (used for deploys and rollbacks) plus a moving "latest".
      - name: Build for amd64 + arm64 and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
