name: notification-service

on:
  pull_request:
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/notification-service.yml'
  push:
    branches: [main]
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/notification-service.yml'

permissions:
  contents: read

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the "packageManager" field of package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: services/notification-service/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/notification-service/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
