name: e2e

# No path filter: a change anywhere (API, web, payment simulator, compose file) can break the
# purchase flow, and this is the only workflow that runs all of them together.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Builds the images and starts every service in the background. --wait returns when the
      # services with a healthcheck are healthy and the others are running.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
        timeout-minutes: 15

      # Not every service has a healthcheck, so "running" does not mean "answering" yet.
      # Ask the API and the web app until both answer, for 3 minutes at most (36 x 5 s).
      - name: Wait until the API and the web app answer
        run: |
          for attempt in $(seq 1 36); do
            if curl --silent --fail --output /dev/null http://localhost:8080/actuator/health/readiness &&
               curl --silent --fail --output /dev/null http://localhost:3000; then
              echo "The stack is ready."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt of 36)."
            sleep 5
          done
          echo "The stack did not become ready in 3 minutes."
          exit 1

      # Reads the pnpm version from the "packageManager" field of e2e/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      # --with-deps also installs the system libraries Chromium needs on Ubuntu.
      - name: Install the browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: e2e
        run: pnpm test
        env:
          # Also check the e-mails that the notification service sends to Mailpit.
          E2E_CHECK_EMAIL: 'true'

      # always(): the report matters most when the tests failed (screenshots and traces).
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Print the service logs
        if: failure()
        run: docker compose logs --tail=200
