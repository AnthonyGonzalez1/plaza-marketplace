name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  store-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/store-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Compiles, runs unit and integration tests (Testcontainers uses the runner's Docker)
      # and fails if the code is not formatted (spotless:check).
      - name: Build, test and check formatting
        run: ./mvnw -B verify

  # Checks that the Helm chart is valid and renders with the local values. The chart is
  # installed in a real cluster by deploy/kind/up.sh (and in CI from S8).
  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint and render chart (local values)
        run: |
          helm lint deploy/helm/plaza --values deploy/helm/plaza/values-local.yaml --strict
          helm template plaza deploy/helm/plaza --values deploy/helm/plaza/values-local.yaml > /dev/null

      # The production file leaves three values to deploy time; placeholders stand in here.
      - name: Lint and render chart (production values)
        env:
          PROD_ARGS: >-
            --values deploy/helm/plaza/values-prod.yaml
            --set imageTag=ci
            --set ingress.host=plaza.example.com
            --set postgres.password=ci
            --set payments.webhookSecret=ci
            --set rabbitmq.password=ci
        run: |
          helm lint deploy/helm/plaza $PROD_ARGS --strict
          helm template plaza deploy/helm/plaza $PROD_ARGS > /dev/null
