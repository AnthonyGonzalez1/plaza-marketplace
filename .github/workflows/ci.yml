name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  store-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/store-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Compiles, runs unit and integration tests (Testcontainers uses the runner's Docker)
      # and fails if the code is not formatted (spotless:check).
      - name: Build, test and check formatting
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t store-api:ci .
