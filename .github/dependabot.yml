version: 2
updates:
  - package-ecosystem: maven
    directory: /services/store-api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/store-api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly

  # One pull request per week for all frontend packages, instead of one per package.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/payment-simulator
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /services/payment-simulator
    schedule:
      interval: weekly
    groups:
      payment-simulator-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
